{% load static %}

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Meu Blog</title>

    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>

<body>
    <h1>Seja bem-vindo ao meu blog!</h1>
    <h1>Meu Blog</h1>

    {% for post in posts %}

        <article>
            <h2>{{ post.title }}</h2>

            <p>{{ post.body }}</p>

            <hr>
        </article>

    {% empty %}

        <p>Nenhum post encontrado.</p>

    {% endfor %}

</body>
</html>
